# LAINOS - WIN-KITTY

# Keyboard shortcuts
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+enter new_window
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
map ctrl+shift+f toggle_fullscreen

# Lain wallpaper
background_image C:/Users/onlyz/.config/kitty/lain-room.jpg
background_image_layout scaled
background_image_linear yes

# LAINOS COLOR THEME
background #0b0e17
foreground #c8d5f0

background_opacity 0.92
background_tint 0.15

selection_foreground #ffffff
selection_background #164e63

cursor #00e5ff
cursor_text_color #0b0e17

url_color #00e5ff

active_tab_foreground #00e5ff
active_tab_background #101b2b

inactive_tab_foreground #718096
inactive_tab_background #0b0e17

tab_bar_background #0b0e17

# TAB COLORS
active_tab_foreground #00e5ff
active_tab_background #101b2b
active_tab_font_style bold

inactive_tab_foreground #718096
inactive_tab_background #0d111b
inactive_tab_font_style normal

tab_bar_background #0d111b
tab_title_template "{title}"
# FONT
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.5